name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:clarity
      - run: npm run test:check-clarity
      - run: npm run check:ga4
      - run: npm run test:check-ga4
      - run: npm run check:email-protection
      - run: npm run test:check-email-protection
